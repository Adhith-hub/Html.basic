<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
    <h1>Unorderd list</h1>
    <ul><li>html</li>
        <li>java</li>
        <li>c++</li>   
    </ul>
    <h1>Orderd list</h1>
    <ol><li>learn Python</li>
        <li>learn java</li>
        <li>learn c+</li>
    </ol>
    <h1>Definition list</h1>
    <dt>HTML</dd>
    <dd>hyper text markup language</dt>
    <dt>OOP</dt> 
    <dd>odject oriented programming</dd>

</body>
</html>
