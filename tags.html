<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>My <b>name</b> is Adhith</p>
    <p>My <strong>name</strong> is Adhith</p>
    <p><i>My name is Adhith</i></p>
    <p><em>My name is Adhith</em></p>
    <p><u>My name is Adhith</u></p>
    <p><ins>My</ins> name is Adhith</p>
    <p><del>My</del> name is Adhith</p>
    <p><mark>My</mark> name is Adhith</p>
    <p>H<sub>2</sub>o</p>
    <p>H<sup>2</sup></p>
    <p>Hello<small>haii</small></p>
</body>
</html>
